# Copy to ignored config.yaml and configure the project/model once.
# Pass each session's fresh Kaggle URL with freecompute --remote-url "URL".
# While running, /connect URL reconnects without saving the temporary URL.
# Credentials belong in private .env/process environment, not this YAML.
workspace_root: "."
# Legacy quota/undo compatibility files only. Authoritative SQLite state is in
# the per-user FreeCompute/workspaces directory outside the project/OneDrive.
journal_dir: ".qwen_harness"
selected_profile: kaggle-qwen-historical-64k
selected_worker: kaggle-qwen
transport: cloudflare
request_timeout_seconds: 900

model_profiles:
  - profile_id: kaggle-qwen-historical-64k
    model: qwen3.8-27b-huihui-abliterated-q4
    engine: llama.cpp
    capabilities: [text, code_tools]
    context_capacity: 65536 # Declared allocation, not full input-capacity certification.
    reserved_completion: 2048
    resource_requirements: [gpu0, gpu1]
    verification: unverified # Configured label; do not promote without evidence.

workers:
  - worker_id: kaggle-qwen
    location: kaggle
    engine: llama.cpp
    # Placeholder fallback; --remote-url overrides it for the current run.
    url: http://127.0.0.1:8081
    api_key_env: FREECOMPUTE_API_KEY
    profiles: [kaggle-qwen-historical-64k]
    concurrency_limit: 1
    resource_pool: kaggle-dual-t4
    resources: [gpu0, gpu1]
