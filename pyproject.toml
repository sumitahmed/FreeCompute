[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "freecompute"
version = "0.1.0"
description = "Local-first AI agent harness powered by remote GPU inference."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [
    { name = "FreeCompute Contributors" }
]
keywords = ["ai", "agent", "coding-agent", "kaggle", "gpu", "inference", "llama-cpp", "qwen"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Code Generators",
]

dependencies = [
    "pydantic>=2.0.0",
    "pyyaml>=6.0",
    "websockets>=12.0",
    "prompt-toolkit>=3.0.48,<4",
    "rich>=13.9,<15",
]

[project.optional-dependencies]
spike = ["openhands-sdk==1.50.1; python_version >= '3.12'"]
dev = [
    "pytest>=7.0.0",
]

[project.scripts]
freecompute = "harness.cli.main:main"

[tool.setuptools.packages.find]
include = ["harness*"]
exclude = ["harness.experiments*"]

[tool.setuptools.package-data]
harness = ["config.sample.yaml"]

[tool.setuptools.data-files]
"share/freecompute/skills/code-reviewer" = ["skills/code-reviewer/SKILL.md"]
"share/freecompute/skills/web-researcher" = ["skills/web-researcher/SKILL.md"]
"share/freecompute/skills/neetcode-solver" = ["skills/neetcode-solver/SKILL.md"]
